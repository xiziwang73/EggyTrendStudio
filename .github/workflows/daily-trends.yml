name: Daily Trend Refresh

on:
  schedule:
    # 16:05 UTC = 00:05 Asia/Shanghai
    # GitHub scheduled runs can be delayed, so this is a daily near-midnight refresh rather than a hard real-time clock.
    - cron: "5 16 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_trends.py"
      - ".github/workflows/daily-trends.yml"

permissions:
  contents: write

concurrency:
  group: daily-trends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect daily trends and rebuild lifecycle history
        run: python scripts/update_trends.py

      - name: Validate required outputs
        run: |
          test -s data/latest.json
          test -s data/history.json
          python - <<'PY'
          import json
          latest=json.load(open('data/latest.json',encoding='utf-8'))
          history=json.load(open('data/history.json',encoding='utf-8'))
          assert latest.get('items'), 'latest.json has no items'
          assert history.get('archive_days',0) >= 1, 'history archive_days missing'
          assert history.get('topics'), 'history.json has no topics'
          print('validated', len(latest['items']), 'latest items and', len(history['topics']), 'history topics')
          PY

      - name: Commit updated trend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/archive/
          if git diff --cached --quiet; then
            echo "No trend changes to commit"
          else
            git commit -m "data: refresh trends and lifecycle history"
            git pull --rebase origin main
            git push
          fi
