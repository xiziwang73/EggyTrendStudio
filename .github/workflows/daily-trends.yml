name: Daily Trend Refresh

on:
  schedule:
    # 16:00 UTC = 00:00 Asia/Shanghai (next calendar day)
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect previous day trends
        run: python scripts/update_trends.py

      - name: Commit updated trend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/archive/
          if git diff --cached --quiet; then
            echo "No trend changes to commit"
          else
            git commit -m "data: refresh daily trends"
            git push
          fi
