<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>蛋仔小游戏生产台</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --text:#171a21; --muted:#747b8b;
    --primary:#6c5ce7; --primary-soft:#f0edff; --green:#19a974; --green-soft:#eaf8f2;
    --red:#e25555; --red-soft:#fff0f0; --amber:#f59e0b; --amber-soft:#fff6e5;
    --border:#e8eaf0; --shadow:0 8px 30px rgba(35,40,70,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  button,input{font:inherit}
  .app{min-height:100vh}
  .shell{max-width:1180px;margin:0 auto;padding:28px 24px 96px}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
  .brand small{display:block;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
  .brand h1{margin:0;font-size:30px;line-height:1.15}
  .brand p{margin:8px 0 0;color:var(--muted);font-size:14px}
  .top-actions{display:flex;gap:10px;align-items:center}
  .btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;transition:.18s ease}
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:#fff;border:1px solid var(--border);color:var(--muted)}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.pass{background:var(--green-soft);color:var(--green)}
  .btn.reject{background:var(--red-soft);color:var(--red)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:16px;padding:8px;margin-bottom:20px;box-shadow:var(--shadow)}
  .tab{flex:1;min-width:140px;border:0;background:transparent;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:800;color:var(--muted)}
  .tab.active{background:var(--primary);color:white}
  .panel{display:none}
  .panel.active{display:block}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:8px 0 14px}
  .section-head h2{margin:0;font-size:22px}
  .section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .stat b{font-size:24px;display:block;margin-bottom:4px}
  .stat span{font-size:12px;color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;box-shadow:var(--shadow)}
  .row-main{min-width:0}
  .row-title{font-weight:800;font-size:15px;margin-bottom:7px}
  .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#f1f2f5;color:#626979}
  .tag.primary{background:var(--primary-soft);color:var(--primary)}
  .tag.hot{background:var(--amber-soft);color:var(--amber)}
  .tag.source{background:#fff0f4;color:#d9467a}
  .row-actions{display:flex;gap:8px;white-space:nowrap}
  .row-actions .btn{padding:8px 11px;font-size:12px}
  .empty{background:#fff;border:1px dashed #d9dce6;border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}
  .topic-card{background:#fff;border:1px solid var(--border);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
  .topic-header{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;cursor:pointer}
  .topic-header:hover{background:#fcfcfe}
  .topic-title{font-size:17px;font-weight:900;margin-bottom:7px}
  .topic-sub{font-size:12px;color:var(--muted)}
  .question-area{border-top:1px solid var(--border);padding:14px 18px 18px;background:#fafbfe}
  .question{background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px}
  .q-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .q-title{font-weight:850;font-size:14px;line-height:1.5}
  .q-status{font-size:11px;font-weight:800;border-radius:999px;padding:5px 8px;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .option{background:#f7f8fb;border-radius:10px;padding:10px 11px;font-size:12px;color:#343946}
  .q-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center}
  .ai-note{font-size:11px;color:var(--muted)}
  .q-actions{display:flex;gap:8px}
  .q-actions .btn{padding:8px 12px;font-size:12px}
  .library-header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .search{margin-left:auto;border:1px solid var(--border);border-radius:12px;padding:9px 12px;background:#fff;min-width:220px}
  .badcase-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}
  .badcase-card .reason{font-size:12px;color:var(--muted);margin-top:6px}
  .badge-neg{color:var(--red);background:var(--red-soft);font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;height:max-content}
  .data-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
  .data-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .data-card h3{margin:0 0 12px}
  .funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .funnel-step{border-radius:14px;padding:14px;text-align:center;background:#f7f8fb}
  .funnel-step b{font-size:22px;display:block;margin-bottom:4px}
  .funnel-step span{font-size:11px;color:var(--muted)}
  .insight{padding:12px;border-radius:12px;background:var(--primary-soft);color:#5145bd;font-size:13px;line-height:1.6;margin-bottom:8px}
  .feedback{margin-top:14px;padding:14px;border:1px dashed #cfcafc;border-radius:14px}
  .feedback strong{display:block;margin-bottom:6px}
  .feedback p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
  .toast{position:fixed;right:22px;bottom:22px;background:#171a21;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s;z-index:99}
  .toast.show{opacity:1;transform:translateY(0)}
  @media(max-width:760px){
    .shell{padding:18px 14px 90px}
    .topbar{flex-direction:column}
    .stats{grid-template-columns:1fr 1fr}
    .row{grid-template-columns:1fr}
    .row-actions{justify-content:flex-end}
    .options{grid-template-columns:1fr}
    .data-grid{grid-template-columns:1fr}
    .funnel{grid-template-columns:1fr 1fr}
    .library-header{align-items:stretch}
    .search{margin-left:0;width:100%;min-width:0}
  }
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <small>EGGY TREND STUDIO</small>
        <h1>蛋仔小游戏生产台</h1>
        <p>热点 → 人工选题 → AI 出题 → 人工筛题 → 发布 → 数据反哺</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost" onclick="resetDemo()">重置演示</button>
        <button class="btn primary" onclick="seedNewTopic()">+ 模拟新热点</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="review">选题审核 <span id="tabReviewCount"></span></button>
      <button class="tab" data-tab="library">选题库 <span id="tabLibraryCount"></span></button>
      <button class="tab" data-tab="badcase">Badcase <span id="tabBadcaseCount"></span></button>
      <button class="tab" data-tab="data">数据飞轮</button>
    </div>

    <section id="review" class="panel active">
      <div class="section-head">
        <div><h2>选题审核</h2><p>一行一个候选选题，只做关键决策：通过 / 淘汰。</p></div>
      </div>
      <div class="stats" id="reviewStats"></div>
      <div class="list" id="reviewList"></div>
    </section>

    <section id="library" class="panel">
      <div class="section-head">
        <div><h2>选题库</h2><p>每个通过选题都是一个大框，展开后直接审核该主题下的题干与选项。</p></div>
      </div>
      <div class="library-header">
        <span class="tag primary">进行中</span>
        <span class="tag">已完成题库</span>
        <input id="searchInput" class="search" placeholder="搜索选题..." oninput="renderLibrary()" />
      </div>
      <div id="topicLibrary"></div>
    </section>

    <section id="badcase" class="panel">
      <div class="section-head">
        <div><h2>Badcase 库</h2><p>保留被淘汰的选题和题目，作为负样本帮助下一轮推荐和生成。</p></div>
      </div>
      <div id="badcaseList"></div>
    </section>

    <section id="data" class="panel">
      <div class="section-head">
        <div><h2>数据飞轮</h2><p>人工决策不是终点，而是下一轮模型排序与生成的训练信号。</p></div>
      </div>
      <div class="data-grid">
        <div class="data-card">
          <h3>当前漏斗</h3>
          <div class="funnel" id="funnel"></div>
          <div class="feedback">
            <strong>飞轮逻辑</strong>
            <p>候选热点特征 → 你的通过/淘汰 → 题目通过/淘汰 → 发布表现 → 反向调整下一轮选题排序与出题偏好。</p>
          </div>
        </div>
        <div class="data-card">
          <h3>系统正在学到什么</h3>
          <div id="insights"></div>
        </div>
      </div>
    </section>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const INITIAL = {
  topics: [
    {id:1,title:"测测你是哪种三角洲玩家？",source:"抖音",heat:87,growth:"+126%",fresh:"9/10",type:"游戏IP",status:"pending"},
    {id:2,title:"测测你的厨艺天赋",source:"小红书",heat:74,growth:"+68%",fresh:"8/10",type:"生活趣味",status:"pending"},
    {id:3,title:"测测你是什么小猫表情包？",source:"抖音",heat:82,growth:"+91%",fresh:"9/10",type:"社交热点",status:"pending"},
    {id:4,title:"测测你穿越进宫能活几集？",source:"B站",heat:69,growth:"+40%",fresh:"7/10",type:"影视综艺",status:"pending"},
    {id:5,title:"测测你的开学人格",source:"微博",heat:61,growth:"+18%",fresh:"6/10",type:"校园",status:"pending"}
  ],
  library: [],
  badcases: []
};

let state = JSON.parse(localStorage.getItem("eggy_demo_state") || "null") || structuredClone(INITIAL);

const questionTemplates = {
  1:[
    {id:"1-1",text:"你进局后第一件事通常做什么？",options:["A. 先搜物资","B. 直接找人打架","C. 跟着队友走","D. 先观察地图"],status:"pending"},
    {id:"1-2",text:"遇到交火时，你更倾向于？",options:["A. 主动出击","B. 找掩体观察","C. 呼叫队友一起行动","D. 绕后偷袭"],status:"pending"},
    {id:"1-3",text:"一局里你最看重什么？",options:["A. 击杀数","B. 搜到好东西","C. 队伍配合","D. 活到最后"],status:"pending"},
  ],
  default:[
    {id:null,text:"朋友临时改变计划时，你通常会？",options:["A. 马上适应","B. 先问清楚原因","C. 提出新方案","D. 更想按原计划"],status:"pending"},
    {id:null,text:"面对一个陌生挑战，你第一反应是？",options:["A. 先试再说","B. 观察别人怎么做","C. 找攻略","D. 拉朋友一起"],status:"pending"},
    {id:null,text:"如果只能选一个标签形容自己，你更喜欢？",options:["A. 行动力","B. 稳定","C. 有趣","D. 聪明"],status:"pending"}
  ]
};

function save(){ localStorage.setItem("eggy_demo_state",JSON.stringify(state)); updateCounts(); }
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}
function qsFor(topic){
  const src = questionTemplates[topic.id] || questionTemplates.default;
  return src.map((q,i)=>({...q,id:q.id || `${topic.id}-${i+1}`}));
}
function passTopic(id){
  const t=state.topics.find(x=>x.id===id); if(!t)return;
  t.status="passed";
  state.library.push({...t,questions:qsFor(t),expanded:true});
  save(); renderAll(); toast("已进入选题库");
}
function rejectTopic(id){
  const t=state.topics.find(x=>x.id===id); if(!t)return;
  t.status="rejected";
  state.badcases.push({kind:"选题",title:t.title,reason:"人工淘汰",meta:`来源 ${t.source} · 热度 ${t.heat} · 增长 ${t.growth}`});
  save(); renderAll(); toast("已进入 Badcase");
}
function passQuestion(topicId,qid){
  const topic=state.library.find(x=>x.id===topicId), q=topic?.questions.find(x=>x.id===qid);
  if(!q)return; q.status="passed"; save(); renderLibrary(); renderData(); toast("题目已通过");
}
function rejectQuestion(topicId,qid){
  const topic=state.library.find(x=>x.id===topicId), q=topic?.questions.find(x=>x.id===qid);
  if(!q)return;
  q.status="rejected";
  state.badcases.push({kind:"题目",title:q.text,reason:`所属选题：${topic.title}`,meta:q.options.join(" / ")});
  save(); renderLibrary(); renderBadcases(); renderData(); toast("题目已进入 Badcase");
}
function toggleTopic(id){ const t=state.library.find(x=>x.id===id); if(t){t.expanded=!t.expanded;save();renderLibrary();}}
function updateCounts(){
  const pending=state.topics.filter(x=>x.status==="pending").length;
  document.getElementById("tabReviewCount").textContent=`(${pending})`;
  document.getElementById("tabLibraryCount").textContent=`(${state.library.length})`;
  document.getElementById("tabBadcaseCount").textContent=`(${state.badcases.length})`;
}
function renderReview(){
  const pending=state.topics.filter(x=>x.status==="pending");
  const passed=state.topics.filter(x=>x.status==="passed").length;
  const rejected=state.topics.filter(x=>x.status==="rejected").length;
  document.getElementById("reviewStats").innerHTML=`
    <div class="stat"><b>${pending.length}</b><span>待审核</span></div>
    <div class="stat"><b>${passed}</b><span>已通过</span></div>
    <div class="stat"><b>${rejected}</b><span>已淘汰</span></div>
    <div class="stat"><b>${state.badcases.length}</b><span>累计 Badcase</span></div>`;
  document.getElementById("reviewList").innerHTML=pending.length?pending.map(t=>`
    <div class="row">
      <div class="row-main">
        <div class="row-title">${t.title}</div>
        <div class="meta">
          <span class="tag source">${t.source}</span><span class="tag hot">热度 ${t.heat}</span>
          <span class="tag">增长 ${t.growth}</span><span class="tag">新鲜度 ${t.fresh}</span><span class="tag primary">${t.type}</span>
        </div>
      </div>
      <div class="row-actions">
        <button class="btn reject" onclick="rejectTopic(${t.id})">淘汰</button>
        <button class="btn pass" onclick="passTopic(${t.id})">通过</button>
      </div>
    </div>`).join(""):`<div class="empty">今天的候选选题已经审核完了。</div>`;
}
function renderLibrary(){
  const q=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();
  const list=state.library.filter(t=>t.title.toLowerCase().includes(q));
  document.getElementById("topicLibrary").innerHTML=list.length?list.map(t=>{
    const passed=t.questions.filter(x=>x.status==="passed").length, pending=t.questions.filter(x=>x.status==="pending").length;
    return `<div class="topic-card">
      <div class="topic-header" onclick="toggleTopic(${t.id})">
        <div><div class="topic-title">${t.title}</div><div class="topic-sub">候选题目 ${t.questions.length} · 待筛选 ${pending} · 已通过 ${passed}</div></div>
        <button class="btn ghost">${t.expanded?"收起":"展开"}</button>
      </div>
      ${t.expanded?`<div class="question-area">
        ${t.questions.map((x,i)=>`
          <div class="question">
            <div class="q-top">
              <div class="q-title">Q${i+1}　${x.text}</div>
              <span class="q-status" style="${x.status==="passed"?"background:var(--green-soft);color:var(--green)":x.status==="rejected"?"background:var(--red-soft);color:var(--red)":""}">
                ${x.status==="passed"?"已通过":x.status==="rejected"?"已淘汰":"待审核"}
              </span>
            </div>
            <div class="options">${x.options.map(o=>`<div class="option">${o}</div>`).join("")}</div>
            <div class="q-bottom">
              <span class="ai-note">AI 生成 · 归属于该选题</span>
              ${x.status==="pending"?`<div class="q-actions">
                <button class="btn reject" onclick="event.stopPropagation();rejectQuestion(${t.id},'${x.id}')">淘汰</button>
                <button class="btn pass" onclick="event.stopPropagation();passQuestion(${t.id},'${x.id}')">通过</button>
              </div>`:""}
            </div>
          </div>`).join("")}
      </div>`:""}
    </div>`;
  }).join(""):`<div class="empty">还没有通过的选题。先去「选题审核」通过几个。</div>`;
}
function renderBadcases(){
  const el=document.getElementById("badcaseList");
  el.innerHTML=state.badcases.length?state.badcases.slice().reverse().map(b=>`
    <div class="badcase-card">
      <div><div class="row-title">${b.title}</div><div class="reason">${b.reason}</div><div class="reason">${b.meta}</div></div>
      <span class="badge-neg">${b.kind} Badcase</span>
    </div>`).join(""):`<div class="empty">暂无 Badcase。被淘汰的选题和题目会保留在这里。</div>`;
}
function renderData(){
  const reviewed=state.topics.filter(x=>x.status!=="pending").length;
  const lib=state.library.length;
  const qs=state.library.flatMap(x=>x.questions);
  const qPassed=qs.filter(x=>x.status==="passed").length;
  const qReviewed=qs.filter(x=>x.status!=="pending").length;
  document.getElementById("funnel").innerHTML=[
    ["已审选题",reviewed],["通过选题",lib],["已审题目",qReviewed],["通过题目",qPassed]
  ].map(([n,v])=>`<div class="funnel-step"><b>${v}</b><span>${n}</span></div>`).join("");
  let insights=[];
  const rejTopics=state.badcases.filter(x=>x.kind==="选题").length;
  const rejQs=state.badcases.filter(x=>x.kind==="题目").length;
  if(rejTopics) insights.push(`你已产生 ${rejTopics} 条选题负样本，可用于降低相似选题的后续推荐权重。`);
  if(rejQs) insights.push(`你已产生 ${rejQs} 条题目 Badcase，可用于优化同类题干与选项生成。`);
  if(lib) insights.push(`当前选题库已有 ${lib} 个通过主题，可以继续积累“什么题材你会通过”的正样本。`);
  if(!insights.length) insights.push("完成几次通过/淘汰后，这里会开始形成你的个人选题偏好。");
  document.getElementById("insights").innerHTML=insights.map(x=>`<div class="insight">${x}</div>`).join("");
}
function seedNewTopic(){
  const id=Math.max(0,...state.topics.map(x=>x.id))+1;
  const pool=["测测你是哪种开学搭子？","测测你在朋友眼里是什么动物？","测测你觉醒哪种异能？"];
  state.topics.push({id,title:pool[id%pool.length],source:"抖音",heat:72+(id%15),growth:`+${40+id*3}%`,fresh:"8/10",type:"热点候选",status:"pending"});
  save(); renderAll(); toast("已模拟加入一个新热点");
}
function resetDemo(){ localStorage.removeItem("eggy_demo_state"); state=structuredClone(INITIAL); renderAll(); toast("演示数据已重置"); }
function renderAll(){updateCounts();renderReview();renderLibrary();renderBadcases();renderData();}
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active"); document.getElementById(btn.dataset.tab).classList.add("active");
});
renderAll();
</script>
</body>
</html>
