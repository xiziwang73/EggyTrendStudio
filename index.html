<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EggyTrendStudio</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#171a21;--muted:#747b8b;--primary:#6c5ce7;--green:#19a974;--red:#e25555;--amber:#f59e0b;--border:#e8eaf0;--shadow:0 8px 30px rgba(35,40,70,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 24px 90px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.brand small{font-weight:800;color:var(--muted)}.brand h1{margin:5px 0;font-size:30px}.brand p{margin:0;color:var(--muted);font-size:14px}.sync{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 13px;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:8px;margin-bottom:18px;box-shadow:var(--shadow)}.tab{flex:1;border:0;background:transparent;border-radius:11px;padding:12px;font-weight:800;color:var(--muted);cursor:pointer}.tab.active{background:var(--primary);color:#fff}.panel{display:none}.panel.active{display:block}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 14px}.head h2{margin:0}.head p{margin:5px 0 0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap}.control{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:9px}.row{background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;box-shadow:var(--shadow)}.title{font-size:15px;font-weight:850;margin-bottom:7px;line-height:1.45}.meta{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#f1f2f5;color:#626979;font-weight:750}.tag.source{background:#fff0f4;color:#d9467a}.tag.rank{background:#fff6e5;color:#c77900}.tag.date{background:#f0edff;color:#6c5ce7}.actions{display:flex;gap:7px}.btn{border:0;border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer}.btn.pass{background:#eaf8f2;color:var(--green)}.btn.reject{background:#fff0f0;color:var(--red)}.btn.ghost{background:#f1f2f5;color:#626979}.empty{background:#fff;border:1px dashed #d9dce6;border-radius:15px;padding:40px;text-align:center;color:var(--muted)}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}.card .small{font-size:12px;color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.insight{background:#f0edff;color:#5145bd;border-radius:12px;padding:12px;margin-bottom:8px;line-height:1.6}.toast{position:fixed;right:22px;bottom:22px;background:#171a21;color:#fff;padding:11px 14px;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1}.loading{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:760px){.shell{padding:18px 12px 80px}.top{flex-direction:column}.tabs{flex-wrap:wrap}.tab{min-width:42%}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.actions{justify-content:flex-end}.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="shell">
<div class="top"><div class="brand"><small>EGGY TREND STUDIO</small><h1>蛋仔小游戏生产台</h1><p>全网热点 → 人工审核 → 正/负样本 → 内容生成 → 发布 → 数据反哺</p></div><div class="sync" id="syncInfo">正在读取每日热点…</div></div>
<div class="tabs"><button class="tab active" data-tab="review">热点审核 <span id="cReview"></span></button><button class="tab" data-tab="library">通过库 <span id="cPass"></span></button><button class="tab" data-tab="badcase">Badcase <span id="cBad"></span></button><button class="tab" data-tab="data">数据飞轮</button></div>
<section id="review" class="panel active"><div class="head"><div><h2>每日热点审核</h2><p>系统全量入库，不预先替你删除；你的通过/淘汰就是偏好数据。</p></div><div class="tools"><select id="sourceFilter" class="control" onchange="renderReview()"><option value="all">全部来源</option></select><input id="search" class="control" placeholder="搜索热点" oninput="renderReview()"></div></div><div class="stats" id="stats"></div><div class="list" id="reviewList"><div class="loading">读取热点中…</div></div></section>
<section id="library" class="panel"><div class="head"><div><h2>通过库</h2><p>你认为值得继续转成“测测”主题的热点。</p></div></div><div id="passList"></div></section>
<section id="badcase" class="panel"><div class="head"><div><h2>Badcase 库</h2><p>你淘汰的热点将作为负样本，后续用于学习你的筛选偏好。</p></div></div><div id="badList"></div></section>
<section id="data" class="panel"><div class="head"><div><h2>数据飞轮</h2><p>先把人工审核数据积累起来，再训练排序/推荐逻辑。</p></div></div><div class="grid"><div class="card"><h3>审核漏斗</h3><div id="funnel"></div></div><div class="card"><h3>当前系统信号</h3><div id="insights"></div></div></div></section>
</div><div id="toast" class="toast"></div>
<script>
let feed={date:'',generated_at:'',items:[],sources:[]};
let decisions=JSON.parse(localStorage.getItem('eggy_trend_decisions')||'{}');
function save(){localStorage.setItem('eggy_trend_decisions',JSON.stringify(decisions));renderAll()}
function decision(id){return decisions[id]||'pending'}
function setDecision(id,v){decisions[id]=v;save();toast(v==='passed'?'已通过':'已淘汰')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateCounts(){const p=feed.items.filter(x=>decision(x.id)==='pending').length,a=feed.items.filter(x=>decision(x.id)==='passed').length,b=feed.items.filter(x=>decision(x.id)==='rejected').length;document.getElementById('cReview').textContent=`(${p})`;document.getElementById('cPass').textContent=`(${a})`;document.getElementById('cBad').textContent=`(${b})`;document.getElementById('stats').innerHTML=`<div class="stat"><b>${feed.items.length}</b><span>${esc(feed.date)} 入库</span></div><div class="stat"><b>${p}</b><span>待审核</span></div><div class="stat"><b>${a}</b><span>已通过</span></div><div class="stat"><b>${b}</b><span>已淘汰</span></div>`}
function row(x){return `<div class="row"><div><div class="title">${esc(x.title)}</div><div class="meta"><span class="tag source">${esc(x.source)}</span><span class="tag rank">平台 #${x.rank}</span><span class="tag date">${esc(x.date)}</span><span class="tag">${esc(x.type||'原始热搜')}</span></div></div><div class="actions"><button class="btn reject" onclick="setDecision('${esc(x.id)}','rejected')">淘汰</button><button class="btn pass" onclick="setDecision('${esc(x.id)}','passed')">通过</button></div></div>`}
function renderReview(){const src=document.getElementById('sourceFilter').value,q=document.getElementById('search').value.trim().toLowerCase();const list=feed.items.filter(x=>decision(x.id)==='pending'&&(src==='all'||x.source===src)&&(!q||x.title.toLowerCase().includes(q)));document.getElementById('reviewList').innerHTML=list.length?list.map(row).join(''):'<div class="empty">当前筛选条件下没有待审核热点。</div>'}
function simpleList(status,target,label){const list=feed.items.filter(x=>decision(x.id)===status);document.getElementById(target).innerHTML=list.length?list.map(x=>`<div class="card"><div class="title">${esc(x.title)}</div><div class="small">${esc(x.source)} · 平台 #${x.rank} · ${esc(x.date)} · ${label}</div><div class="actions" style="margin-top:10px"><button class="btn ghost" onclick="setDecision('${esc(x.id)}','pending')">撤回到待审核</button></div></div>`).join(''):`<div class="empty">暂无数据。</div>`}
function renderData(){const total=feed.items.length,p=feed.items.filter(x=>decision(x.id)==='pending').length,a=feed.items.filter(x=>decision(x.id)==='passed').length,b=feed.items.filter(x=>decision(x.id)==='rejected').length;document.getElementById('funnel').innerHTML=`<div class="insight">原始热点 ${total} → 已审核 ${total-p} → 通过 ${a} / 淘汰 ${b}</div>`;const by={};feed.items.forEach(x=>{if(decision(x.id)==='passed')by[x.source]=(by[x.source]||0)+1});const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];document.getElementById('insights').innerHTML=[`当前已积累 ${a} 条正样本、${b} 条负样本。`,top?`目前通过最多的平台是 ${top[0]}（${top[1]} 条）。`:'完成审核后，这里会开始显示你的来源偏好。','下一阶段可把标题、平台、排名、题材标签与你的决策一起作为排序模型特征。'].map(x=>`<div class="insight">${x}</div>`).join('')}
function renderAll(){updateCounts();renderReview();simpleList('passed','passList','正样本');simpleList('rejected','badList','负样本');renderData()}
async function init(){try{const r=await fetch(`data/latest.json?v=${Date.now()}`);if(!r.ok)throw new Error('HTTP '+r.status);feed=await r.json();const sel=document.getElementById('sourceFilter');feed.sources.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o)});document.getElementById('syncInfo').textContent=`最新数据：${feed.date} · ${feed.count||feed.items.length} 条 · ${feed.sources.join(' / ')}`;renderAll()}catch(e){document.getElementById('syncInfo').textContent='每日热点读取失败';document.getElementById('reviewList').innerHTML=`<div class="empty">无法读取 data/latest.json：${esc(e.message)}</div>`}}
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.tab).classList.add('active')});init();
</script></body></html>
